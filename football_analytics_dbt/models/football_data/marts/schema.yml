version: 2

models:

  - name: dim_player
    description: "Dimensión de jugadores con su categoría general y rol táctico principal en el campo"
    columns:
      - name: player_key
        description: "Clave surrogate del jugador generada a partir de player_id"
        data_tests:
          - unique
          - not_null
      - name: player_id
        description: "Clave primaria natural del jugador"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football_data__PLAYERS_RAW')
                field: player_id
      - name: name
        description: "Nombre completo del jugador"
        data_tests:
          - not_null
      - name: primary_category
        description: "Categoría posicional general del jugador en el campo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['GOALKEEPER', 'DEFENDER', 'MIDFIELDER', 'ATTACKER']
      - name: primary_role_code
        description: "Código del rol táctico principal del jugador"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football_data__POSITIONS_RAW')
                field: role_code
      - name: primary_side_code
        description: "Código del perfil o banda principal en el campo asociada al rol táctico primario"

  - name: dim_season
    description: "Dimensión conformada de temporadas de estudio (2022-2026)"
    columns:
      - name: season_key
        description: "Clave surrogate de la temporada generada a partir de season_id"
        data_tests:
          - unique
          - not_null
      - name: season_id
        description: "Clave primaria natural de la temporada"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_football_data__SEASONS_RAW')
                field: season_id
      - name: season_label
        description: "Etiqueta descriptiva del periodo de la temporada"
        data_tests:
          - not_null

  - name: dim_age_bracket
    description: "Dimensión conformada de edades y rangos etarios para el análisis del ciclo de vida deportivo"
    columns:
      - name: age_key
        description: "Clave surrogate de la edad generada a partir del valor de age"
        data_tests:
          - unique
          - not_null
      - name: age
        description: "Edad exacta del jugador en años cumplidos durante la temporada"
        data_tests:
          - unique
          - not_null
      - name: age_group
        description: "Rango o grupo etario de estudio: '15-21', '22-26', '27-31', '32-38'"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['15-21', '22-26', '27-31', '32-38']

  - name: fact_player_season
    description: "Tabla de hechos periódica por jugador y temporada que integra rendimiento deportivo, variación anual de habilidad e ingreso salarial"
    columns:
      - name: player_season_key
        description: "Clave surrogate única del registro de jugador por temporada"
        data_tests:
          - unique
          - not_null
      - name: player_key
        description: "Clave foránea surrogate hacia la dimensión dim_player"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: season_key
        description: "Clave foránea surrogate hacia la dimensión dim_season"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: age_key
        description: "Clave foránea surrogate hacia la dimensión dim_age_bracket"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_age_bracket')
                field: age_key
      - name: ability_score
        description: "Puntaje de habilidad deportiva del jugador registrado en la temporada"
        data_tests:
          - not_null
      - name: ability_score_delta
        description: "Variación anual del puntaje de habilidad respecto a la temporada anterior del jugador para medir la tasa de deterioro o crecimiento"
      - name: weekly_wage_eur
        description: "Salario semanal del contracto vigente del jugador en euros durante la temporada"
        data_tests:
          - not_null
      - name: annual_wage_eur
        description: "Salario anualizado del contrato vigente del jugador en euros durante la temporada (weekly_wage_eur × 52)"
        data_tests:
          - not_null